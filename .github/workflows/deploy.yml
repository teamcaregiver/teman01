name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only needs to push the built site to the gh-pages branch.
# No `pages:`/`id-token:` and no `environment:` block — those are for the
# artifact-based deploy, and they are what triggered the
# "Branch main is not allowed to deploy to github-pages" protection rule.
permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fail fast with a readable message. Without this, an unset value is
      # substituted as an empty string and the build dies ~2 minutes later
      # inside the prerender with a 500 that hides the real cause.
      - name: Check required build config is set
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set as an Actions variable or secret."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Both build values are present."

      # `npm run build` also fires the `postbuild` script, which promotes the
      # SPA shell to index.html and writes 404.html + .nojekyll (required on a
      # branch deploy, or Jekyll would drop the underscore-prefixed files).
      # The Supabase vars are needed at BUILD time: src/lib/supabase/client.ts
      # throws if they are missing, and the SPA-shell prerender executes it.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Publish dist/client to gh-pages with plain git and the built-in token —
      # same end result as the `gh-pages` npm package, no third-party action.
      # A fresh repo + force push keeps the branch to a single commit, which is
      # why gh-pages has no shared history with main (and can't be PR'd into).
      - name: Publish dist/client to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/client/index.html || { echo "::error::dist/client/index.html missing"; exit 1; }
          cd dist/client
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published $(git ls-files | wc -l) files to gh-pages."
